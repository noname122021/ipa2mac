[metadata]
name = Cut the Rope
bundle_id = com.zeptolab.cuttherope
tested_version = 2.7.1
engine = zeptolab_cpp
rendering = gles_20
sound_system = openal_audiotoolbox

[window]
width = 360
height = 540
aspect_ratio = 2:3
resizable = true
orientation = portrait
scale_mode = aspect_fit

[shims]
touch_remapping = true
calayer_aspect_fit = true
uiscreen_bounds_fixed = 320x480
uiscreen_native_bounds = 640x960
keychain = in_memory
assert_suppress = true
path_redirect = documents
activation_policy = regular

[notes]
; macOS WindowServer enforces ~515pt titlebar width minimum.
; Two-level CALayerHost / CAEAGLLayer aspect-fit centering is applied.
; -[UITouch locationInView:] and previousLocationInView: remapped with matrix transform for pixel-perfect physics cuts.
