[metadata]
name = VLC for Mobile
bundle_id = org.videolan.vlc-ios
tested_version = 3.0.2
engine = native_swift_libvlc
rendering = uikit_metal_opengl
sound_system = coreaudio_audiounit

[window]
width = 960
height = 600
aspect_ratio = free
resizable = true
orientation = free
scale_mode = native

[shims]
multi_framework_retag = MobileVLCKit.framework,MediaLibraryKit.framework
network_entitlements = true
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
path_redirect = documents
activation_policy = regular

[notes]
; Embedded dynamic frameworks MobileVLCKit and MediaLibraryKit must be retagged with vtool.
; Requires network server and client entitlements for Wi-Fi sharing and UPnP/DLNA streams.
