[metadata]
name = Alto's Adventure
bundle_id = com.snowman.alto
tested_version = 1.6.2
engine = unity_5
rendering = metal
sound_system = unity_coreaudio

[window]
width = 960
height = 540
aspect_ratio = 16:9
resizable = true
orientation = landscape
scale_mode = aspect_fit

[shims]
ubiquitous_store = true
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
assert_suppress = true
path_redirect = documents
activation_policy = regular

[notes]
; Traps on [NSUbiquitousKeyValueStore defaultStore] neutralized via MockUbiquitousStore.
; AppKit mouseUp close handler guarded to prevent premature exit during active play.
