[metadata]
name = Infinity Blade II
bundle_id = com.chairentertainment.IB2
tested_version = 1.3.5
engine = unreal_engine_3_mobile
rendering = gles_20
sound_system = openal_audioqueue

[window]
width = 1024
height = 768
aspect_ratio = 4:3
resizable = false
orientation = landscape
scale_mode = aspect_fit

[shims]
hardware_model = iPad8,1
user_interface_idiom = pad
audio_session_set_delegate_neutralize = true
fake_mpmovieplayer = true
ascii_path_redirect = /tmp/SwordGame.app
memory_fault_recovery = true
block_abort_raise = true
suppress_sigaction = true
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
path_redirect = documents
activation_policy = regular
binary_patch = 0x8c33c:*:550200b4a0aa40b91f2003d5

[notes]
; UE3 2011 iOS runtime assumes strict ASCII file system paths and chokes on Unicode/Cyrillic paths.
; Symlinked /tmp/SwordGame.app and intercepted -[NSBundle bundlePath/resourcePath].
; Neutralized [AVAudioSession setDelegate:] to avoid dyld bootstrap deadlocks.
; Replaced missing MPMoviePlayerController with event-dispatching fake object.
; Window resizing disabled to maintain fixed UE3 render buffers.
