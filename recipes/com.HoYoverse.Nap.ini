[metadata]
name = Zenless Zone Zero
bundle_id = com.HoYoverse.Nap
tested_version = 3.3.1
engine = unity
rendering = metal
sound_system = wwise_criware

[window]
width = 1280
height = 720
aspect_ratio = 16:9
resizable = true
orientation = landscape
scale_mode = aspect_fit

[shims]
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
activation_policy = regular

[notes]
; Unity 2019.4 custom MiHoYo engine with Wwise and CriMana.
; Metal shader compilation takes ~20-30s on first launch before the first frame paints.
