[metadata]
name = Zenless Zone Zero
bundle_id = com.HoYoverse.Nap
tested_version = 3.3.1
engine = unity
rendering = metal
sound_system = wwise_criware

[window]
width = 1280
height = 720
aspect_ratio = 16:9
resizable = true
orientation = landscape
scale_mode = aspect_fit

[shims]
audio_session_fix = true
hardware_model = iPad14,3
keychain = in_memory
memory_fault_recovery = true
assert_suppress = true
path_redirect = documents
activation_policy = regular

[notes]
; Unity 2019.4 custom MiHoYo engine with Wwise and CriMana.
; audio_session_fix prevents AVAudioSession XPC synchronous reply deadlock during static initialization.
; Metal shader compilation takes ~20-30s on first launch before the first frame paints.
