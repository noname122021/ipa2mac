[metadata]
name = Zenless Zone Zero
bundle_id = com.HoYoverse.Nap
tested_version = 3.3.1
engine = unity
rendering = metal
sound_system = wwise_criware

[mod_window]
width = 1280
height = 800
aspect = 16:10
resizable = true
hook_screen = true

[shims]
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
keyboard_touch = true
portable_home = true

