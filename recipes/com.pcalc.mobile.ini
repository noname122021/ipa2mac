[metadata]
name = PCalc
bundle_id = com.pcalc.mobile
tested_version = 3.7.5
engine = native_cocoatouch_c
rendering = uikit_coregraphics
sound_system = system_audio

[window]
aspect_ratio = free
resizable = true
scale_mode = native

[shims]
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
activation_policy = regular
path_redirect = documents

[notes]
; Scientific calculator with rich themes and key layouts.
; Native Catalyst windowing without artificial size overrides.
