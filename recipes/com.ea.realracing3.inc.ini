[metadata]
name = Real Racing 3
bundle_id = com.ea.realracing3.inc
tested_version = 14.0.1
engine = mint3
rendering = metal
sound_system = openal

[window]
aspect_ratio = 16:9
resizable = true
orientation = landscape
scale_mode = aspect_fit

[shims]
mod_window = true
mod_window_close = true
mod_input_context = true
core_keychain = true
statfs_spoof = true
game_center_auto_auth = true
activation_policy = regular
hardware_model = iPad6,7
user_interface_idiom = pad
marketplace_kit_stub = true
virtual_gamepad = true

[virtual_gamepad]
; Keyboard racing: W = throttle, S/Space = brake, A/D = steer. Arrows = d-pad.
; Enter = A, Esc/Tab = Menu (pause + back), Backspace/R = B (back in menus, rear view in race), V = camera.
map = w:rt s:lt a:ls_left d:ls_right space:lt
      up:dpad_up down:dpad_down left:dpad_left right:dpad_right
      enter:a esc:menu tab:menu backspace:b r:b v:y
block_touches = false
mouse_capture = false
announce = true

[notes]
; Real Racing 3 (v14.0.1) adapted for macOS via ipa2mac.
; Mint3 engine with Metal rendering.
; OFFLINE ASSETS (~5.7 GB): Unpack Caches.zip into:
;   ~/Library/Containers/com.ea.realracing3.inc/Data/Library/Caches/
;   or symlink: ln -s "/path/to/Caches" ~/Library/Containers/com.ea.realracing3.inc/Data/Library/Caches
; MarketplaceKit shim injected for EU iOS 17.4+ AppDistributor weak imports.
; game_center_auto_auth suppresses modal login prompts and avoids cancel abort.
