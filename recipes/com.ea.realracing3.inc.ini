[metadata]
name = Real Racing 3
bundle_id = com.ea.realracing3.inc
tested_version = 14.0.1
engine = mint3
rendering = metal
sound_system = openal

[window]
width = 1280
height = 720
aspect_ratio = 16:9
resizable = true
orientation = landscape
scale_mode = aspect_fit

[shims]
mod_window = true
mod_window_close = true
mod_input_context = true
core_keychain = true
statfs_spoof = true
game_center_auto_auth = true
activation_policy = regular
hardware_model = iPad6,7
user_interface_idiom = pad

[notes]
; Real Racing 3 (v14.0.1) adapted for macOS via ipa2mac.
; Mint3 engine with Metal rendering.
; OFFLINE ASSETS (~5.7 GB): Unpack Caches_ipastore.zip into:
;   ~/Library/Containers/com.ea.realracing3.inc/Data/Library/Caches/
;   or symlink: ln -s "/path/to/Caches" ~/Library/Containers/com.ea.realracing3.inc/Data/Library/Caches
; MarketplaceKit shim injected for EU iOS 17.4+ AppDistributor weak imports.
; game_center_auto_auth suppresses modal login prompts and avoids cancel abort.
