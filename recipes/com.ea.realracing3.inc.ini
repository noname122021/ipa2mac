[metadata]
name = Real Racing 3
bundle_id = com.ea.realracing3.inc
tested_version = 14.0.1
engine = mint3
rendering = metal
sound_system = openal
hint = Place game caches into RealRacing3_Data/Caches or Library/Caches

[mod_window]
width = 1280
height = 720
aspect = 16:9
resizable = true
screen = 1280x692
pad_idiom = true

[shims]
device_spoof = true
mod_window = true
mod_window_close = true
mod_input_context = true
core_keychain = true
statfs_spoof = true
game_center_auto_auth = true
marketplace_kit_stub = true
virtual_gamepad = true
portable_home = true
strip_dylibs = true

[mod_window_close]
immediate_exit = true

[strip_dylibs]
remove = AppData.dylib, iPASTORERR3Fix.dylib

[virtual_gamepad]
; Keyboard racing: W = throttle, S/Space = brake, A/D = steer. Arrows = d-pad.
; Enter = A, Esc/Tab = Menu (pause + back), Backspace/M = B (back in menus, rear view in race), V = camera.
map = w:rt s:lt a:ls_left d:ls_right space:lt
      up:dpad_up down:dpad_down left:dpad_left right:dpad_right
      enter:a esc:menu tab:menu backspace:b m:b v:y
block_touches = false
mouse_capture = false

[device_spoof]
model = iPad6,7

[notes]
; Real Racing 3 (v14.0.1) adapted for macOS via ipa2mac.
; Mint3 engine with Metal rendering.
; OFFLINE ASSETS (~7.7 GB): Place into RealRacing3_Data/Caches or Library/Caches next to .app (handled by portable_home).
; strip_dylibs removes unwanted third-party ad/store dylibs (AppData.dylib, iPASTORERR3Fix.dylib).
; MarketplaceKit shim injected for EU iOS 17.4+ AppDistributor weak imports.
; game_center_auto_auth suppresses modal login prompts and avoids cancel abort.
