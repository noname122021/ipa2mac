[metadata]
name = EcoFlow
bundle_id = com.ef.EcoFlow
tested_version = 6.11.0
engine = native_swift_objc
rendering = uikit_metal
sound_system = system_audio

[window]
width = 768
height = 1024
aspect_ratio = 3:4
resizable = false
orientation = portrait
scale_mode = aspect_fit

[shims]
user_interface_idiom = pad
hardware_model = iPad8,1
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
activation_policy = regular
path_redirect = documents

[notes]
; Modern IoT smart hardware control dashboard.
; Forced UIUserInterfaceIdiomPad (1) provides desktop-like multi-panel tablet layout.
; Window aspect locked to 3:4 iPad tablet ratio.
