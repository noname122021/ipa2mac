[metadata]
name = GoodReader Pro
bundle_id = com.goodiware.grpro
tested_version = 5.6.1119
engine = native_objc_cpp
rendering = uikit_pdfkit
sound_system = coreaudio

[window]
width = 800
height = 1000
aspect_ratio = free
resizable = true
orientation = free
scale_mode = native

[shims]
user_interface_idiom = pad
path_redirect = documents
cffixed_user_home = true
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
activation_policy = regular

[notes]
; High-performance PDF reader and file manager.
; CFFIXED_USER_HOME ensures local storage stays persistent in user's Documents folder.
; Supports desktop document viewing without sandbox permission aborts.
