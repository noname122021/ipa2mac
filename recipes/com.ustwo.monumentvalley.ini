[metadata]
name = Monument Valley
bundle_id = com.ustwo.monumentvalley
tested_version = 2.10.2
engine = unity_il2cpp
rendering = metal
sound_system = unity_coreaudio

[window]
resizable = false
orientation = portrait
scale_mode = native

[shims]
ubiquitous_store = true
ubiquitous_dictionary_representation = true
frameworks_retag = UnityFramework.framework
assert_suppress = true
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
path_redirect = documents
activation_policy = regular

[notes]
; Multi-binary bundle requires retagging UnityFramework.framework/UnityFramework.
; NSUbiquitousKeyValueStore must support dictionaryRepresentation selector to prevent IL2CPP abort.
