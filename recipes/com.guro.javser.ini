[metadata]
name = JAVser
bundle_id = com.guro.javser
tested_version = 1.0.0
engine = compose_multiplatform_kotlin_native
rendering = skiko_metal
sound_system = avfoundation

[window]
width = 900
height = 700
aspect_ratio = free
resizable = true
orientation = free
scale_mode = native

[shims]
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
activation_policy = regular
path_redirect = documents
background_tasks_redirect = true
link_flags = -Wl,-reexport_framework,BackgroundTasks

[notes]
; Kotlin Multiplatform Compose UI app.
; Runs on Metal via Skiko with seamless native window resizing.
