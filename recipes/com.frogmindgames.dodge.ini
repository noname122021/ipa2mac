[metadata]
name = BADLAND
bundle_id = com.frogmindgames.dodge
tested_version = 3.4.3
engine = frogmind_cocos2d
rendering = gles_metal
sound_system = fmod_coreaudio

[window]
width = 960
height = 540
aspect_ratio = 16:9
resizable = true
orientation = landscape
scale_mode = aspect_fit

[shims]
dyld_fishhook_suppress = true
audio_session_fix = true
audio_unthrottle = true
hardware_model = iPad8,1
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
memory_fault_recovery = true
assert_suppress = true
path_redirect = documents
activation_policy = regular
ubiquitous_store = true
everyplay_stub = true

[notes]
; Suppresses deadlock in _dyld_register_func_for_add_image from internal fishhook.
; CoreAudio IOThread unthrottled for crisp 44.1kHz FMOD playback.
