[metadata]
name = Red Dead Redemption
bundle_id = com.rockstargames.rdr
tested_version = 1.50.60293175
engine = rage
rendering = metal
sound_system = system_audio

[window]
width = 1280
height = 720
aspect_ratio = 16:9
resizable = true
orientation = landscape
scale_mode = aspect_fit

[shims]
hardware_model = iPad14,6
user_interface_idiom = pad
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
odr_bypass = true
; Shaders are MSL 3.2 / AIR 2.7 (iOS 18 SDK). macOS 14 only compiles up to 3.1 -> every PSO fails,
; black screen, then NULL-PSO crash in d11::MtlContext_c::DrawIndexed. Lowered at runtime only
; where the OS needs it (no-op on macOS 15+).
metal_lang_downgrade = true
; ODR content (asset pack tag "game") is looked up via NSBundle pathForResource:...inDirectory:"game".
; Served from an external folder instead of <app>/game, so the bundle never needs re-signing.
odr_external = true
; Game supports MFi controllers but has no Mac keyboard handler -> keyboard/trackpad as a gamepad.
virtual_gamepad = true
; Arm64 file offsets in the thinned 1.50.60293175 binary (offset:original:replacement):
;  0xae760  RequestResource block: NOP `cbz w1` so the ODR "not available" path is skipped.
;  0xff03d4 __stubs entry of _os_proc_available_memory -> mov x0,#0x100000000 (4 GiB); ret.
binary_patch = 0xae760:01020034:1f2003d5
               0xff03d4:10100090100641f9:2000c0d2c0035fd6

[mod_window_close]
; Catalyst X only hides the window and exit() hangs in RAGE teardown -> X button calls _exit(0).
immediate_exit = true

[virtual_gamepad]
; Xbox-style RDR layout for a MacBook trackpad: click in the window captures the pointer (Option releases).
; One finger = camera, tap/click (one or two fingers) = fire, hold Q = aim.
map = w:ls_up s:ls_down a:ls_left d:ls_right
      mouse_left:rt mouse_right:rt q:lt left_shift:a space:x f:y e:lb z:b r:rb c:r3 left_ctrl:l3
      enter:a backspace:b esc:menu m:options up:dpad_up down:dpad_down left:dpad_left right:dpad_right
mouse_sensitivity = 0.5
capture_key = left_alt

[odr_external]
; <app>/game/... is served from here (relative = inside ~/Library/Containers/<bundle id>/Data).
dir = Library/Application Support/Got/data
subdir = game

[notes]
; Rockstar Games Red Dead Redemption (iOS port, RAGE + d11 layer over Metal).
; Base assets ship in <app>/data (2.7 GB). ODR assets (3.5 GB: grassres/audio/audio2/content/
; cutscene/psocache *_ios.rpf, arm00.bk2, blk00.bk2, base/, cero/, redemption/) are NOT in the IPA.
;
; Install ODR (no re-sign needed):
;   unzip "Caches.zip" -d ~/Library/Containers/com.rockstargames.rdr/Data/
;     -> .../Data/Library/Application Support/Got/data/{*.rpf,base,cero,redemption,...}
; The chosen folder is logged as "[ipa2mac] odr_external: ..." (Console.app / stderr).
