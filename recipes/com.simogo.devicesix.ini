[metadata]
name = DEVICE 6
bundle_id = com.simogo.devicesix
tested_version = 1.4
engine = native_objc
rendering = uikit_gles
sound_system = system_audio

[window]
width = 768
height = 1024
aspect_ratio = 3:4
resizable = true
orientation = portrait
scale_mode = aspect_fit

[shims]
keychain = in_memory
activation_policy = regular
window_styling = true
window_close_exit = true
path_redirect = documents
device_rotation_menu = true

[notes]
; Surreal mystery narrative game.
; Runs cleanly in portrait tablet aspect ratio.
