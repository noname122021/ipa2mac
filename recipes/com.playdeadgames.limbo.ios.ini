[metadata]
name = LIMBO
bundle_id = com.playdeadgames.limbo.ios
tested_version = 1.1.28
engine = playdead_cpp
rendering = custom_metal
sound_system = fmod_coreaudio

[window]
width = 1152
height = 648
aspect_ratio = 16:9
resizable = true
orientation = landscape
scale_mode = aspect_fit

[shims]
hardware_model = iPad8,1
game_center_auto_auth = true
keychain = in_memory
assert_suppress = true
path_redirect = documents
activation_policy = regular

[overrides:1.1.19]
hardware_model = iPad7,1
game_center_auto_auth = true

[notes]
; Spoofs sysctlbyname("hw.machine") to iPad8,1 so custom engine chooses high-end profile.
; Auto-completes GKLocalPlayer authenticateHandler to prevent modal loop.
