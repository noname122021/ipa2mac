[metadata]
name = LIMBO
bundle_id = com.playdeadgames.limbo.ios
tested_version = 1.1.28
engine = playdead_cpp
rendering = custom_metal
sound_system = fmod_coreaudio

[mod_window]
width = 1152
height = 648
aspect = 16:9
resizable = true

[shims]
device_spoof = true
game_center_auto_auth = true
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
assert_suppress = true
dyld_fishhook_suppress = true
binary_patch = true

[device_spoof]
model = iPad8,1

[binary_patch]
; Skip main-thread pthread_cond_wait during app launch.
; On iOS the main run loop is already spinning when didFinishLaunchingWithOptions:
; blocks; on macOS Catalyst the scene-creation callback holds the run loop, so
; CADisplayLink (drawView:) never fires → game thread never signals "ready" → deadlock.
; Patch: cbnz w8,+7 → b +7 (unconditional skip of the wait loop at +0xed96c).
patches = 0xed96c:e8000035:07000014

[notes]
; Uses OpenGL ES (EAGL/CAEAGLLayer), not Metal. Catalyst emulates EAGL via ANGLE.
; Binary calls uname() to read hw.machine, then strncmp for iPad/iPhone/iPod prefix.
;   Unrecognized device → "Unsupported Device" alert → main thread deadlocks.
;   iPad8,1 maps to valid device profile via internal jump table.
; Catalyst deadlock: didFinishLaunchingWithOptions: blocks main thread waiting for
;   game thread, but game thread waits for CADisplayLink (drawView:) which needs the
;   main run loop. Binary patch at +0xed96c skips the main-thread wait so the run loop
;   can deliver CADisplayLink ticks. Version-specific: tested on IPA 1.1.19.2.
; dyld_fishhook_suppress: prevents deadlock from legacy fishhook calling
;   _dyld_register_func_for_add_image during dyld load.
; Auto-completes GKLocalPlayer authenticateHandler to prevent modal loop.
