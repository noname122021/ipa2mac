[metadata]
name = Genshin Impact Cloud
bundle_id = com.hoyoverse.cloudgames.GenshinImpact
tested_version = 7.2.0
engine = hoyoverse_cloud
rendering = metal
sound_system = system_audio

[window]
width = 1280
height = 720
aspect_ratio = 16:9
resizable = true
orientation = landscape
scale_mode = aspect_fit

[shims]
genshin_cloud_fix = true
hardware_model = iPad14,6
user_interface_idiom = pad
assert_suppress = true
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
path_redirect = documents
activation_policy = regular

[notes]
; HoYoverse cloud game streaming client.
; Legacy Swift frameworks require libswiftUIKit.dylib -> macOS Catalyst UIKit redirection.
; Hardware model iPad14,6 provides M2 iPad profile required by LibAvEngine video decoding.
; Assert suppression prevents SIGABRT in TouchableVideoView mouse click handler.
; genshin_cloud_fix clears blackColor and opaque flag on TouchableVideoView CAMetalLayer.
