[metadata]
name = Genshin Impact Cloud
bundle_id = com.hoyoverse.cloudgames.GenshinImpact
tested_version = 7.2.0
engine = hoyoverse_cloud
rendering = metal
sound_system = system_audio

[mod_window]
width = 1280
height = 720
aspect = 16:9
resizable = true
hook_screen = true
pad_idiom = true

[shims]
device_spoof = true
genshin_cloud_fix = true
assert_suppress = true
core_keychain = true
mod_window = true
mod_window_close = true
mod_input_context = true
keyboard_touch = true

[device_spoof]
model = iPad14,6

[keyboard_touch]
; From PlayCover/keymaps com.miHoYo.GenshinImpact/Genshin Impact fixed 16by9.playmap.
; Toggle key overlay with ` (grave) or F12; hold Option (left_alt) for camera swipe.
map = space:0.921,0.656 e:0.731,0.860 1:0.900,0.211 2:0.901,0.321 3:0.900,0.435 4:0.904,0.537 u:0.656,0.054 i:0.716,0.055 o:0.776,0.057 p:0.831,0.053 b:0.893,0.051 c:0.954,0.050 escape:0.032,0.058 m:0.108,0.143 f:0.633,0.500 g:0.634,0.414 j:0.037,0.240 v:0.097,0.298 r:0.697,0.746 tab:0.181,0.052 t:0.757,0.674 enter:0.041,0.918 q:0.644,0.900 z:0.326,0.900 h:0.717,0.504 y:0.237,0.053 left_ctrl:0.976,0.950 l:0.065,0.499 n:0.021,0.140 x:0.826,0.766 left_shift:0.922,0.863
joystick = w,a,s,d:0.156,0.763,0.13
swipe_key = right_alt

[notes]
; HoYoverse cloud game streaming client.
; Legacy Swift frameworks require libswiftUIKit.dylib -> macOS Catalyst UIKit redirection.
; Hardware model iPad14,6 provides M2 iPad profile required by LibAvEngine video decoding.
; Assert suppression prevents SIGABRT in TouchableVideoView mouse click handler.
; genshin_cloud_fix clears blackColor and opaque flag on TouchableVideoView CAMetalLayer.
